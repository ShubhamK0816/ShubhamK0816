# Draws the contribution snake shown in README.md.
# Output: snake-dark.svg and snake-light.svg on the `snake` branch.
name: Snake

on:
  schedule:
    - cron: "37 18 * * *" # daily at 00:07 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F89820
            dist/snake-light.svg?palette=github-light&color_snake=#B45309

      - name: Publish to the snake branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
